<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>雾港回响 · 百幕</title>
<style>
  :root{
    --bg:#04080a; --panel:#0b1419; --panel2:#101d25;
    --line:rgba(126,170,180,.16); --line2:rgba(126,170,180,.36);
    --ink:#dbe6e2; --muted:#8296a0; --dim:#5d727b;
    --gold:#c9a24b; --gold-dim:#7d652f; --teal:#67b8a9;
    --red:#d4564b; --green:#57b368; --purple:#a98bdf; --abyss:#3d7392;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:rgba(201,162,75,.12)}
  html,body{margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:
      radial-gradient(1100px 700px at 12% -12%, #0d222b 0%, transparent 58%),
      radial-gradient(900px 620px at 94% 6%, #141b2c 0%, transparent 52%),
      linear-gradient(#050a0d,#03070a 62%,#050a0d);
    color:var(--ink); font-family:var(--serif); line-height:1.78;
    min-height:100vh; min-height:100dvh;
    -webkit-text-size-adjust:100%; overflow-x:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    touch-action:manipulation; overscroll-behavior-y:contain;
  }
  button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
  input,textarea{user-select:text;-webkit-user-select:text}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .fog{position:fixed;pointer-events:none;filter:blur(70px);opacity:.5;z-index:0}
  .fog-a{width:70vw;height:70vw;left:-22vw;top:-26vw;
    background:radial-gradient(circle,rgba(46,104,110,.4),transparent 66%);
    animation:drift 30s ease-in-out infinite alternate}
  .fog-b{width:62vw;height:62vw;right:-22vw;bottom:-22vw;
    background:radial-gradient(circle,rgba(40,62,110,.38),transparent 66%);
    animation:drift 40s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.16)}}
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.3;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
  body.low-san .scan{opacity:.5;background:repeating-linear-gradient(0deg,rgba(180,40,40,.03) 0 1px,transparent 1px 4px)}
  body.san-murk .scene h2,
  body.san-murk .scene .body p,
  body.san-murk .scene .sub,
  body.san-murk .scene .ask,
  body.san-murk .opt .t{
    filter:blur(.12px);letter-spacing:.01em;
    text-shadow:0 0 1px rgba(212,86,75,.2),0 0 8px rgba(120,20,20,.12)}
  body.san-warp .scene h2,
  body.san-warp .scene .body p,
  body.san-warp .scene .sub,
  body.san-warp .scene .ask,
  body.san-warp .opt .t{
    font-family:"STKaiti","KaiTi","Kaiti SC",var(--serif);
    font-style:italic;letter-spacing:.03em;filter:blur(.35px);
    text-shadow:0 0 2px rgba(212,86,75,.3),1px 1px 0 rgba(60,8,8,.38)}
  body.san-15 .scene h2,
  body.san-15 .scene .body p,
  body.san-15 .scene .sub,
  body.san-15 .scene .ask,
  body.san-15 .opt .t{
    filter:blur(.6px);letter-spacing:.06em}
  body.san-zero .scan{opacity:.62;background:repeating-linear-gradient(0deg,rgba(180,40,40,.06) 0 1px,transparent 1px 3px)}
  body.san-zero .scene{border-left-color:var(--red);
    box-shadow:0 0 46px rgba(120,20,20,.18),0 22px 56px rgba(0,0,0,.5)}
  body.san-zero .scene h2,
  body.san-zero .scene .body p,
  body.san-zero .scene .sub,
  body.san-zero .scene .ask,
  body.san-zero .opt .t,
  body.san-zero .act b{
    font-family:"STKaiti","KaiTi","Kaiti SC",var(--serif);
    font-style:italic;letter-spacing:.035em;filter:blur(.9px);
    text-shadow:0 0 2px rgba(212,86,75,.3),1px 1px 0 rgba(60,8,8,.42)}
  body.san-zero .scene h2{font-weight:700;color:#f0d9d2}
  body.san-zero .hud .st b,body.san-zero .sanhead b{color:var(--red)}

  .top{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);
    background:rgba(4,8,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 28px rgba(0,0,0,.34);padding-top:env(safe-area-inset-top);
    transform:translateZ(0)}
  .top .inner{max-width:960px;margin:0 auto;
    padding:8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand>div{min-width:0}
  .seal{width:34px;height:34px;flex:0 0 34px;border:1px solid rgba(201,162,75,.55);
    border-radius:4px;display:grid;place-items:center;color:var(--gold);font-size:18px;
    box-shadow:inset 0 0 16px rgba(201,162,75,.12)}
  .brand b{display:block;font-size:15px;letter-spacing:.16em;color:#eef6f3;font-weight:600;
    line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand i{display:block;font-family:var(--sans);font-style:normal;font-size:9.5px;
    letter-spacing:.18em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbtns{display:flex;gap:6px;flex:0 0 auto}
  .tbtn{font-family:var(--sans);font-size:11.5px;color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.15s;
    white-space:nowrap;min-height:38px;display:inline-flex;align-items:center;justify-content:center}
  .tbtn:active{background:rgba(201,162,75,.12);color:var(--gold)}
  .tbtn.on{color:var(--gold);border-color:var(--gold-dim)}

  .wrap{position:relative;z-index:2;max-width:960px;margin:0 auto;
    padding:10px max(12px, env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left))}

  .hud{margin-bottom:10px}
  .hrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
  .st{background:linear-gradient(180deg,rgba(16,29,37,.9),rgba(9,15,19,.94));
    border:1px solid var(--line);border-radius:9px;padding:5px 6px;text-align:center}
  .st span{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.08em;color:var(--dim)}
  .st b{display:block;font-size:17px;line-height:1.35;color:var(--teal);font-variant-numeric:tabular-nums}
  .sanbox{background:linear-gradient(180deg,rgba(16,29,37,.9),rgba(9,15,19,.94));
    border:1px solid var(--line);border-radius:9px;padding:6px 9px 8px}
  .sanhead{display:flex;align-items:baseline;gap:8px;font-family:var(--sans);
    font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
  .sanhead b{font-family:var(--serif);font-size:14px;color:var(--green);letter-spacing:0}
  .sanhead .spacer{flex:1}
  .sanhead .buff{color:var(--purple);font-size:9.5px;letter-spacing:.02em}
  .bar{height:6px;background:#050b0e;border:1px solid rgba(126,170,180,.12);
    border-radius:7px;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;
    background:linear-gradient(90deg,#3f8f6a,#c9a24b 58%,#d4564b);transition:width .45s ease}
  .prestart .hud{display:none}

  .scene{position:relative;background:linear-gradient(180deg,rgba(16,29,37,.95),rgba(8,14,18,.98));
    border:1px solid var(--line);border-left:3px solid var(--gold-dim);border-radius:13px;
    padding:16px 14px 15px;box-shadow:0 22px 56px rgba(0,0,0,.42);animation:scenein .35s ease;margin-bottom:12px}
  @keyframes scenein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kick{font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;color:var(--abyss);margin-bottom:5px}
  .scene h2{margin:0 0 4px;font-size:clamp(19px,5.4vw,22px);letter-spacing:.06em;color:#eef6f3;font-weight:600;line-height:1.4}
  .scene .sub{font-family:var(--sans);font-size:12px;color:var(--dim);margin-bottom:12px;letter-spacing:.03em;line-height:1.65}
  .body p{margin:.7em 0;font-size:15.5px;line-height:1.85;color:#cbd9d5;text-align:justify;text-justify:inter-ideograph}
  .body p:first-child{margin-top:0}
  .ask{margin:14px 0;background:rgba(8,16,20,.85);border:1px solid var(--line);
    border-left:2px solid var(--abyss);border-radius:8px;padding:11px 12px;
    font-family:var(--sans);font-size:12.5px;color:#a9bdc2;line-height:1.75}
  .ask .h{color:var(--gold);letter-spacing:.14em;font-size:9.5px;margin-bottom:3px}
  .ask b{color:var(--teal)}
  .rail{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 2px}
  .chip{font-family:var(--sans);font-size:10.5px;color:var(--teal);background:rgba(10,20,24,.9);
    border:1px dashed var(--line2);border-radius:20px;padding:6px 12px;cursor:pointer;min-height:34px;
    display:inline-flex;align-items:center;transition:.15s}
  .chip:active{background:rgba(103,184,169,.12)}
  .chip.gold{color:var(--gold);border-color:var(--gold-dim)}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:12px;transition:opacity .3s ease}
  .opts.pending{opacity:0;pointer-events:none}
  .opt{width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);
    background:rgba(10,18,23,.92);color:var(--ink);padding:12px 14px;border-radius:10px;
    font-family:inherit;font-size:14.5px;transition:transform .12s ease,background .15s ease,border-color .15s ease;
    min-height:50px;-webkit-user-select:none;user-select:none}
  .opt:active:not(:disabled){background:rgba(103,184,169,.1);border-color:var(--teal);transform:scale(.993)}
  .opt .t{display:block;line-height:1.55}
  .opt .tag{display:block;margin-top:4px;font-family:var(--sans);font-size:10.5px;color:var(--dim);
    letter-spacing:.04em;line-height:1.55}
  .opt.roll{border-color:rgba(169,139,223,.36)}
  .opt.deep{border-color:rgba(212,86,75,.3)}
  .opt:disabled{opacity:.4;cursor:not-allowed}
  .foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
  .tiny{font-family:var(--sans);font-size:10.5px;color:var(--dim);background:transparent;
    border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer;min-height:36px}
  .tiny:active{color:var(--teal)}

  .maphead{margin-bottom:10px}
  .progress{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--sans);font-size:10.5px;
    color:var(--dim);letter-spacing:.05em;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .progress b{color:var(--teal);font-family:var(--serif);font-size:13px;letter-spacing:0}
  .mapgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
  .site{position:relative;text-align:left;cursor:pointer;background:linear-gradient(180deg,rgba(16,29,37,.92),rgba(9,15,19,.96));
    border:1px solid var(--line);border-radius:11px;padding:11px 11px 10px;color:var(--ink);
    font-family:inherit;transition:transform .12s ease,border-color .15s ease,background .15s ease;
    overflow:hidden;min-height:102px;animation:cardin .3s ease both}
  @keyframes cardin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .site:nth-child(2){animation-delay:.03s}.site:nth-child(3){animation-delay:.06s}
  .site:nth-child(4){animation-delay:.09s}.site:nth-child(5){animation-delay:.12s}
  .site:nth-child(6){animation-delay:.15s}.site:nth-child(7){animation-delay:.18s}
  .site:nth-child(8){animation-delay:.21s}
  .site:active:not(:disabled){border-color:var(--teal);transform:scale(.985);background:rgba(103,184,169,.06)}
  .site .idx{position:absolute;right:8px;top:3px;font-size:25px;font-weight:700;line-height:1.2;
    color:rgba(201,162,75,.13);font-family:var(--sans)}
  .site h3{margin:0 0 3px;font-size:15px;letter-spacing:.04em;font-weight:600;padding-right:24px;line-height:1.4}
  .site .omen{font-family:var(--sans);font-size:10.5px;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
  .site .state{display:inline-block;margin-top:6px;font-family:var(--sans);font-size:9.5px;
    padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .site.done{opacity:.55;cursor:default;animation:none}
  .site.done .state{color:var(--teal);border-color:rgba(103,184,169,.35)}
  .site:disabled{pointer-events:none}
  .actions{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    background:linear-gradient(180deg,rgba(4,8,10,.55),rgba(4,8,10,.97) 42%);
    border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    padding:10px 0 calc(12px + env(safe-area-inset-bottom));margin-top:4px}
  .act{font-family:var(--sans);font-size:12.5px;letter-spacing:.04em;cursor:pointer;
    border:1px solid var(--line);background:rgba(12,22,28,.95);color:var(--ink);
    border-radius:10px;padding:11px 8px;min-height:50px;transition:transform .12s ease,background .15s ease,border-color .15s ease;
    line-height:1.35}
  .act:active:not(:disabled){border-color:var(--teal);background:rgba(103,184,169,.08);transform:scale(.985)}
  .act b{display:block;font-size:13px;color:var(--gold);font-weight:600}
  .act span{display:block;font-size:10px;color:var(--dim);margin-top:1px}
  .act.final{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,162,75,.06)}
  .act.final:active{border-color:var(--gold)}
  .act:disabled{opacity:.38;cursor:not-allowed}
  .act .lock{color:var(--red)}

  .qblock{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:10px 0;
    background:rgba(8,15,19,.7)}
  .qblock .qh{font-size:14px;color:#e6efec;margin-bottom:6px}
  .qblock .qh span{color:var(--gold);font-family:var(--sans);font-size:10px;letter-spacing:.12em;margin-right:6px}
  .line{display:flex;gap:9px;align-items:flex-start;border:1px solid transparent;border-radius:8px;
    padding:10px 9px;cursor:pointer;font-family:var(--sans);font-size:13px;color:#b9c8c5;line-height:1.65;
    min-height:44px;transition:background .15s ease,border-color .15s ease}
  .line.sel{border-color:rgba(201,162,75,.4);background:rgba(201,162,75,.06);color:#e6efec}
  .line input{margin-top:4px;accent-color:#c9a24b;flex:0 0 auto}
  .score{display:flex;align-items:baseline;gap:8px;margin:4px 0 10px}
  .score b{font-size:38px;color:var(--gold);font-family:var(--sans);line-height:1}
  .score span{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
  .qr{border-left:2px solid var(--line2);padding:7px 10px;margin:8px 0;
    font-family:var(--sans);font-size:12px;color:#a9bdc2;line-height:1.7}
  .qr.right{border-color:var(--green)} .qr.wrong{border-color:var(--red)}
  .qr .m{font-weight:700;margin-right:5px}
  .qr.right .m{color:var(--green)} .qr.wrong .m{color:var(--red)}
  .sanloss-banner{position:relative;overflow:hidden;margin:12px 0;padding:13px 14px 11px;
    border:1px solid rgba(212,86,75,.55);border-radius:10px;
    background:linear-gradient(90deg,rgba(72,10,10,.82),rgba(20,8,8,.5));
    text-align:center;animation:sanlosspulse 1.8s ease 2}
  .sanloss-banner::before{content:'✕';position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-size:70px;line-height:1;color:rgba(212,86,75,.09);pointer-events:none}
  .sanloss-banner b{display:block;font-family:var(--sans);font-size:27px;color:#ff8a7c;
    letter-spacing:.1em;text-shadow:0 0 18px rgba(212,86,75,.5)}
  .sanloss-banner small{display:block;margin-top:4px;font-family:var(--sans);font-size:10px;
    color:var(--muted);letter-spacing:.1em}
  .sanloss-banner em{display:block;margin-top:7px;font-family:var(--serif);font-style:normal;
    font-size:10.5px;letter-spacing:.2em;line-height:1.7;color:rgba(240,196,188,.72);
    text-shadow:0 0 9px rgba(180,30,30,.4)}
  @keyframes sanlosspulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 1px rgba(212,86,75,.5),0 0 26px rgba(212,86,75,.25)}}

  .ending{position:relative;text-align:center;border:1px solid var(--line2);border-radius:15px;
    padding:32px 16px 26px;background:linear-gradient(180deg,rgba(17,29,36,.97),rgba(6,11,14,.99));
    box-shadow:0 30px 80px rgba(0,0,0,.55);animation:scenein .5s ease;margin-bottom:12px}
  .ending::before{content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.04);
    border-radius:10px;pointer-events:none}
  .end-kick{font-family:var(--sans);font-size:9.5px;letter-spacing:.4em;color:var(--dim);margin-bottom:10px}
  .ending h2{margin:0 0 6px;font-size:clamp(22px,5vw,30px);letter-spacing:.06em;font-weight:600;line-height:1.4}
  .ending .eid{font-family:var(--sans);font-size:11px;letter-spacing:.22em;color:var(--gold-dim);margin-bottom:12px}
  .ending blockquote{margin:0 auto 16px;max-width:620px;font-style:italic;font-size:13px;color:var(--muted);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 0;line-height:1.9}
  .ebody{max-width:660px;margin:0 auto;text-align:left;font-size:15px;color:#cddad6}
  .ebody p{margin:.7em 0;text-align:justify}
  .estats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:22px 0 4px;
    font-family:var(--sans);font-size:10.5px;color:var(--dim);letter-spacing:.05em}
  .estats b{display:block;font-family:var(--serif);font-size:17px;color:var(--teal);letter-spacing:0}
  .unlock{margin:14px auto 0;max-width:520px;padding:8px 12px;border:1px dashed var(--gold-dim);
    border-radius:8px;font-family:var(--sans);font-size:11.5px;color:var(--gold);line-height:1.7}
  .unlock.growth{border-style:solid;border-color:var(--teal);color:var(--teal);background:rgba(95,182,168,.06)}
  .fogcount{margin-top:12px;font-family:var(--sans);font-size:11px;color:var(--dim);letter-spacing:.08em}
  .fogcount b{color:var(--gold)}
  .endbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .btn{font-family:var(--sans);font-size:13px;letter-spacing:.06em;cursor:pointer;border-radius:9px;
    padding:12px 20px;border:1px solid var(--line2);background:transparent;color:var(--ink);
    min-height:46px;transition:transform .12s ease,background .15s ease,border-color .15s ease}
  .btn:active{border-color:var(--teal);color:var(--teal);transform:scale(.985)}
  .btn.gold{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,162,75,.07)}
  .btn.gold:active{border-color:var(--gold)}
  .tone-gold h2,.tone-gold .eid{color:var(--gold)} .tone-gold{border-color:var(--gold-dim)}
  .tone-teal h2{color:var(--teal)}
  .tone-red h2{color:var(--red)}
  .tone-purple h2{color:var(--purple)}
  .tone-void h2{color:#e8d9a8;text-shadow:0 0 30px rgba(201,162,75,.35)}

  .hero{text-align:center;padding:26px 0 8px}
  .sigil{width:86px;height:86px;margin:0 auto 16px;position:relative;display:grid;place-items:center;
    color:var(--gold);border:1px solid rgba(201,162,75,.45);border-radius:50%;
    box-shadow:0 0 60px rgba(201,162,75,.12),inset 0 0 40px rgba(201,162,75,.06)}
  .sigil span{font-size:30px;line-height:1;text-shadow:0 0 22px rgba(201,162,75,.4)}
  .sigil::before{content:'';position:absolute;inset:8px;border:1px dashed rgba(201,162,75,.25);
    border-radius:50%;animation:spin 50s linear infinite}
  .sigil::after{content:'';position:absolute;inset:20px;border:1px solid rgba(201,162,75,.16);border-radius:50%}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero .k{font-family:var(--sans);font-size:9.5px;letter-spacing:.3em;color:var(--abyss)}
  .hero h1{margin:8px 0 4px;font-size:clamp(30px,8vw,44px);letter-spacing:.14em;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function nl2p(s){
  return String(s || '').split('\n').filter(function(x){ return x.trim() !== ''; })
    .map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('');
}
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){
  var b = a.slice();
  for(var i = b.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

/* ---------- 存档 ---------- */
function loadMeta(){
  try{
    var m = JSON.parse(localStorage.getItem(META_KEY) || 'null');
    if(m && Object.prototype.toString.call(m.unlocked) === '[object Array]'){
      var legacyA = {1:3,2:84,3:47,4:68,5:34,6:100};
      var legacyB = {105:3,106:84,107:47,108:68,109:34,110:100};
      var raw = (m.extra || []).map(function(x){ return legacyB[x] || legacyA[x] || x; }).filter(function(x){ return typeof x === 'number' && x >= 1 && x <= 100; });
      var all = (m.unlocked || []).concat(raw).filter(function(x, i, arr){ return typeof x === 'number' && x >= 1 && x <= 100 && arr.indexOf(x) === i; });
      return { unlocked:all, grand:!!m.grand, arch:(m.arch || []).filter(function(x){ return typeof x === 'number'; }), extra:raw.filter(function(x, i, arr){ return arr.indexOf(x) === i; }), runs:m.runs || 0,
        bonus:Math.max(0, Math.min(60, Number(m.bonus) || 0)),
        growth:(m.growth || []).filter(function(x){ return GROWTH_IDS.indexOf(x) >= 0; }),
        collected:(m.collected || []).filter(function(x){ return SIGILS.some(function(s){ return s.id === x; }); }),
        submit:(m.submit || []).filter(function(x){ return SIGILS.some(function(s){ return s.id === x; }); }),
        bound:(m.bound || []).filter(function(x){ return SIGILS.some(function(s){ return s.id === x; }); }),
        boundAt:(function(){
          var o = m.boundAt || {}, r = {};
          Object.keys(o).forEach(function(k){
            var n = Number(k);
            if(BOUND_SLOTS.indexOf(n) < 0) return;
            if(o[k] === 'triple' || SIGILS.some(function(s){ return s.id === o[k]; })) r[n] = o[k];
          });
          return r;
        })(),
        outerDone:!!m.outerDone };
    }
  }catch(e){}
  return { unlocked:[], grand:false, arch:[], extra:[], runs:0, bonus:0, growth:[], collected:[], submit:[], bound:[], boundAt:{}, outerDone:false };
}

}

  });

function loseSan(n){
  if(!S || n <= 0) return 0;

  }
  var before = S.san;
  var d = Math.max(1, n - Math.floor(S.will / 30));

    S.shield -= ab; d -= ab;
  }
  S.san = clamp(S.san - d, 0, S.maxSan);
  S.sanLost += d;
  if(d > 0){
    var band = '';
    if(S.san <= 0 && before > 0) band = '空壳';
    else if(S.san <= 15 && before > 15) band = '文字错位';
    else if(S.san <= 30 && before > 30) band = '崩解';
    else if(S.san <= 50 && before > 50) band = '低理智';
    S.lastSanNote = '理智 −' + d + (band ? ' · ' + band : '') + '（当前 ' + S.san + '）';
    S.lastSanKind = 'loss';
    updateHud();
    sanFx(-d, 'loss', band);
  }
  if(before >= 50 && S.san < 50){
    if(!S.dmSeen){ S.dmSeen = true; S.dmPending = true; }
    setTimeout(function(){ showForced('雾从纸缝里长出来，带着盐和鳃的味道。有人替你把下一页翻开了。', '低理智 · 弹幕已出现 · 点击它'); }, 600);
  }
  if(before > 30 && S.san <= 30 && S.san > 0) setTimeout(function(){ showForced(pick(FORCED_TEXTS), '崩解 · 印记开始显现'); }, 900);
  if(before > 15 && S.san <= 15 && S.san > 0) setTimeout(function(){ showForced('页码开始自己换位置。你先看见结尾，再看见开头。', '崩解 · 文字开始错位'); }, 900);
  if(before > 0 && S.san <= 0) setTimeout(function(){ showForced('理性归零。本案由你承办，也由你结案。', '空壳 · 祂在等你签字'); }, 900);
  return d;
}

function healSan(n){

/* ---------- 低理智：弹幕 / 强制结案 / 印记 ---------- */
var DM_TIMER = null, DM_GAP = 0, DM_BURST = 1;
function dmGap(){
  if(!S || S.san > 50) return 0;
  var t = Math.max(0, S.san);
  return Math.round((t - 8) * (t >= 8 ? 300 : 200));
}
function stopDanmaku(clear){
  if(DM_TIMER){ clearInterval(DM_TIMER); DM_TIMER = null; }
  DM_GAP = 0;
  DM_BURST = 1;

    var l = document.getElementById('dmLayer');
    if(l) l.innerHTML = '';
  }
}
function syncDanmaku(){
  var live = S && ['hub','site','result','event','night','ded','final'].indexOf(S.node) >= 0 && S.san <= 50;
  if(!live){ stopDanmaku(true); return; }
  if(S.san < 50 && !S.dmSeen){ S.dmSeen = true; S.dmPending = true; }
  var gap = dmGap();
  var burst = gap < 0 ? Math.min(5, 1 + Math.floor(-gap / 400)) : 1;
  var tick = gap <= 0 ? 300 : gap;
  if(DM_TIMER && tick === DM_GAP && burst === DM_BURST){
    if(S.dmPending){ S.dmPending = false; setTimeout(spawnDanmaku, 250); }
    return;
  }
  stopDanmaku(false);
  DM_GAP = tick;
  DM_BURST = burst;
  DM_TIMER = setInterval(function(){
    for(var i = 0; i < DM_BURST; i++) spawnDanmaku();
  }, tick);
  if(S.dmPending){ S.dmPending = false; setTimeout(spawnDanmaku, 250); }
  else setTimeout(function(){ for(var i = 0; i < DM_BURST; i++) spawnDanmaku(); }, 500);
}

function grantSigil(){
  if(!S) return null;
  if(!S.sigils) S.sigils = [];
  var pool = SIGILS.filter(function(x){
    return S.sigils.indexOf(x.id) < 0 && (S.sigilBan || []).indexOf(x.id) < 0;
  });
  if(!pool.length){
    var st = pick(['inv','will','luck']);
    S.buff[st] = (S.buff[st] || 0) + 8;
    addLog('印记重复：下一次' + STAT_LABEL[st] + '判定 +8。');
    return null;
  }
  var t = dedTier();
  var weights = pool.map(function(x){
    if(x.arch === S.arch && x.tier === t) return 5;
    if(x.arch === S.arch) return 2;
    return 1;
  });
  var total = 0;
  weights.forEach(function(w){ total += w; });
  var r = Math.random() * total, acc = 0, s = pool[0];
  for(var i = 0; i < pool.length; i++){
    acc += weights[i];
    if(r <= acc){ s = pool[i]; break; }
  }
  S.sigils.push(s.id);
  if(META.collected.indexOf(s.id) < 0){
    META.collected.push(s.id);
    saveMeta();
  }
  addLog('获得印记：' + s.name + '（' + s.deity + '）。');
  S.lastSigilNote = '得印 · ' + s.glyph + ' ' + s.name + ' · ' + s.deity;
  S.lastSigilKind = 'gain';
  SIGIL_PULSE_ID = s.id;
  updateHud();
  setTimeout(function(){ SIGIL_PULSE_ID = null; updateHud(); }, 1300);
  showSigilCard({
    kind:'gain', glyph:s.glyph, name:s.name,
    sub:s.deity + ' · ' + (STAT_LABEL[s.stat] || '对应属性') + ' +6（SAN≤50 生效） · 纸背多了一枚指印'
  });
  return s;
}
function onDanmaku(el){

/* ---------- 渲染 ---------- */
function render(){
  if(S && S.node !== 'create' && S.node !== 'ending') saveRun();
  if(S && !S.sigils) S.sigils = [];
  if(S && !S.sigilBan) S.sigilBan = [];
  if(S && S.sanHealed === undefined) S.sanHealed = 0;
  if(S && !S.leavers) S.leavers = [];
  if(S && S.zeroJitter === undefined) S.zeroJitter = 0;
  if(S && S.lastSanNote === undefined) S.lastSanNote = '';
  if(S && S.lastSigilNote === undefined) S.lastSigilNote = '';
  if(S && S.dmSeen === undefined){ S.dmSeen = false; S.dmPending = false; }
  updateHud();
  document.body.classList.toggle('low-san', !!(S && S.san <= 30));
  document.body.classList.toggle('san-murk', !!(S && S.san < 50));
  document.body.classList.toggle('san-warp', !!(S && S.san < 30));
  document.body.classList.toggle('san-15', !!(S && S.san <= 15));
  document.body.classList.toggle('san-zero', !!(S && S.san <= 0));
  if(!S){ renderTitle(); lastNode = 'title'; stopDanmaku(true); return; }
  switch(S.node){
    case 'create': renderCreate(); break;
    case 'hub': renderHub(); break;
    case 'site': renderSite(); break;
    case 'result': renderResult(); break;
    case 'event': renderEvent(); break;
    case 'night': renderNight(); break;
    case 'ded': renderDed(); break;
    case 'final': renderFinal(); break;
    case 'ending': renderEnding(); break;
    default: renderTitle();
  }
  syncDanmaku();
  if(S && S.san <= 15 && S.node !== 'ending' && S.node !== 'create') scrambleScene();
  if(S && S.san <= 0 && S.node !== 'ending' && S.node !== 'create') zeroDistort();
  if(S.node !== lastNode){ lastNode = S.node; window.scrollTo(0, 0); }
}
function srand(seed){
  var x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function seededShuffle(arr, seed){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(srand(seed + i * 7.31) * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function scrambleScene(){
  if(!S) return;
  var seed = (S.san + 1) * 97 + (S.zeroJitter || 0) * 31 + (S.time || 0) * 13;
  var h2 = document.querySelector('.scene h2');
  if(h2 && !h2.children.length){
    var chars = h2.textContent.split('');
    seededShuffle(chars, seed + 3);
    h2.textContent = chars.join('');
  }
  var body = document.querySelector('.scene .body');
  if(body){
    var ps = Array.prototype.filter.call(body.children, function(el){ return el.tagName === 'P'; });
    seededShuffle(ps, seed + 11);
    ps.forEach(function(p){ body.appendChild(p); });
    ps.forEach(function(p, i){
      if(p.children.length) return;
      var parts = p.textContent.match(/[^。！？；]+[。！？；]?/g);
      if(parts && parts.length > 1){
        seededShuffle(parts, seed + i * 37);
        p.textContent = parts.join('');
      }
    });
  }
  var grid = document.querySelector('.mapgrid');
  if(grid && grid.children.length > 1){
    var cards = Array.prototype.slice.call(grid.children);
    seededShuffle(cards, seed + 23);
    cards.forEach(function(c){ grid.appendChild(c); });
  }
  var opts = document.querySelector('.scene .opts');
  if(opts && opts.children.length > 1){
    var kids = Array.prototype.slice.call(opts.children);
    seededShuffle(kids, seed + 19);
    kids.forEach(function(k){ opts.appendChild(k); });
  }
}
function zeroDistort(){
  if(!S || S.san > 0) return;
  var nodes = document.querySelectorAll('.scene h2,.scene .sub,.scene .body p,.scene .ask,.scene .opt,.scene .act,.scene .chip,.mapgrid .site,.progress');
  var n = S.zeroJitter || 0;
  for(var i = 0; i < nodes.length; i++){
    var a = Math.sin((i + 1) * 127.1 + n * 311.7) * 43758.5453;
    var b = Math.sin((i + 5) * 47.3 + n * 113.9) * 24634.6345;
    var c = Math.sin((i + 9) * 13.7 + n * 71.3) * 15731.7431;
    a = a - Math.floor(a); b = b - Math.floor(b); c = c - Math.floor(c);
    var dx = (a * 2 - 1) * 5.5;
    var dy = (b * 2 - 1) * 4.5;
    var rot = (c * 2 - 1) * 1.1;
    nodes[i].style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
  }
}

function readDraft(){
  var n = document.getElementById('cName');
  if(n) DRAFT.name = n.value;
  ['inv','will','luck'].forEach(function(k){
    var el = document.getElementById('c' + k.charAt(0).toUpperCase() + k.slice(1));
    if(el && el.value !== ''){
      var v = parseInt(el.value, 10);
      if(!isNaN(v)) DRAFT[k] = v;
    }
  });
}

function finalStats(a){
  a = a || ARCHETYPES[DRAFT.arch] || ARCHETYPES.field;
  return {
    inv: clamp((parseInt(DRAFT.inv, 10) || 0) + a.inv, 5, 99),
    will: clamp((parseInt(DRAFT.will, 10) || 0) + a.will, 5, 99),
    luck: clamp((parseInt(DRAFT.luck, 10) || 0) + a.luck, 5, 99)
  };
}

function updateSums(){
  if(!document.getElementById('sumInv')) return;
  readDraft();
  var f = finalStats();
  var avg = Math.round((f.inv + f.will + f.luck) / 3);
  var grade = avg >= 80 ? 'S' : (avg >= 70 ? 'A' : (avg >= 60 ? 'B' : 'C'));
  var gc = avg >= 80 ? 1 : (avg >= 70 ? 2 : (avg >= 60 ? 3 : 4));
  document.getElementById('sumInv').textContent = f.inv;
  document.getElementById('sumWill').textContent = f.will;
  document.getElementById('sumLuck').textContent = f.luck;
  document.getElementById('sumAll').textContent = avg;
  var g = document.getElementById('sumGrade');
  if(g){ g.textContent = '综合 ' + avg + ' · ' + grade; g.className = 'grade g' + gc; }
  var base = (DRAFT.inv || 0) + (DRAFT.will || 0) + (DRAFT.luck || 0);
  var note = document.getElementById('sumNote');
  if(note){
    var cap = pointCap();
    note.textContent = '基础合计 ' + base + ' / ' + cap + (base > cap ? ' · 已超出' : ' · 剩余 ' + (cap - base));
    note.className = 'sumnote' + (base > cap ? ' over' : '');
  }
}

    out += '</div>';

  out += '<div class="endbtns"><button class="btn gold" data-a="dedsubmit">提交推理</button></div></div>';
  stageEl.innerHTML = out;
}

function caseRecap(){
  var names = S.done.map(function(id){ return SITES[id] ? SITES[id].name : ''; }).filter(Boolean);
  var siteText = names.length ? (names.slice(0, 5).join('、') + (names.length > 5 ? ' 等' : '')) : '还什么都没来得及查';
  var last = S.clues.length ? CLUES[S.clues[S.clues.length - 1]] : null;
  var core = coreCount();
  var txt = '你走过 ' + siteText + '，一共 ' + S.done.length + ' 个现场。卷宗里躺着 ' + S.clues.length + ' 条线索';

  txt += '。';
  txt += core >= 4 ? '四卷残页已经拼齐，纸上的字开始互相认识。' : ('残卷还差 ' + (4 - core) + ' 卷，拼不上的地方像被牙齿咬过。');
  return txt;
}

/* ---------- 选择与结算 ---------- */
function choiceLock(i){
  if(i === 0){
    if(S.tooLate) return '雾已合拢，来不及了';
    if(S.clues.length < 6) return '线索不足 6 条';
  }
  if(i === 3){
    if(S.san < 20) return '理智低于 20';
    if(S.clues.length < 5) return '线索不足 5 条';
  }
  if(i === 4 && coreCount() < 4) return '残卷未齐（' + coreCount() + '/4）';
  return '';
}

function chooseOpt(sid, idx){
  var site = SITES[sid];
  if(!site || S.done.indexOf(sid) >= 0) return;
  var o = site.opts[idx];
  if(!o) return;
  if(o.roll) rollDice(sid, idx);
  else resolveOpt(sid, idx, null);
}

function resolveOpt(sid, idx, dice){
  var site = SITES[sid];
  var o = site.opts[idx];
  var clues = [], text = '', ok = true, roll = null, eff = 0, coreId = null;
  var luckSaved = false, luckRoll = null;
  if(dice){
    roll = dice.roll; ok = dice.ok; eff = dice.eff;
    if(!ok){
      luckRoll = 1 + Math.floor(Math.random() * 100);
      luckSaved = luckRoll <= S.luck;
    }
  }
  if(o.roll){
    text = ok ? o.ok : o.fail;
    clues = (ok ? (o.okClues || []) : (o.failClues || [])).slice();
    if(o.deep && ok){
      var unseen = ['c_name','c_contract','c_zero','c_writer'].filter(function(cid){
        return S.clues.indexOf(cid) < 0;
      });
      if(unseen.length){
        coreId = pick(unseen);
        clues.unshift(coreId);
      }else{
        clues = clues.concat(randomNormalClues(1));
      }
    }
  }else{
    text = o.ok;
    clues = (o.okClues || []).slice();
  }
  var sanCost = (o.san || 0) + (dice && !ok && !luckSaved ? (o.extraSan || 0) : 0);
  if(luckSaved) sanCost = 0;
  var lost = loseSan(sanCost);
  var gained = [];
  clues.forEach(function(cid){ if(giveClue(cid)) gained.push(cid); });
  if(S.inv >= 65){
    var pool = [site.checkClue, site.safeClue];
    for(var pi = 0; pi < pool.length; pi++){
      var ic = pool[pi];
      if(ic && S.clues.indexOf(ic) < 0 && giveClue(ic)){
        gained.push(ic);
        text += '\n\n侦查直觉：你还注意到「' + CLUES[ic].name + '」，这是别人容易漏掉的东西。';
        break;
      }
    }
  }
  if(S.done.indexOf(sid) < 0) S.done.push(sid);
  S.time = Math.max(0, S.time - 1);
  S.curSite = sid;
  S.result = {
    kicker: site.name + ' · ' + (dice ? ('D100 ' + roll + ' / ' + eff) : '安全路线'),
    title: site.title,
    body: text,
    gained: gained, coreId: coreId,
    roll: roll, eff: eff, ok: ok, sanLost: lost,
    luckRoll: luckRoll, luckSaved: luckSaved,
    after: 'siteevent'
  };
  addLog('完成现场「' + site.name + '」，' + (dice ? (ok ? '判定成功' : '判定失败') : '安全走访') + '。');
  S.node = 'result';
  saveRun();
  render();
}

function rollDice(sid, idx){
  var o = SITES[sid].opts[idx];
  var stat = o.roll;
  var eff = Math.max(5, S[stat] + (S.buff[stat] || 0) + sanBonus() - sanPenalty() + sigilBonus(stat));
  S.buff[stat] = 0;
  var roll = 1 + Math.floor(Math.random() * 100);
  var ok = roll <= eff;
  var ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = '<div class="dice"><div class="dl">D100 判定 · ' + STAT_LABEL[stat] + '</div>' +
    '<div class="dn" id="dnum">?</div><div class="ds">目标 ≤ ' + eff + '</div>' +
    '<div class="dv" id="dver">掷骰中……</div>' +
    '<div class="dt" id="dtext">雾把骰子接住了。</div>' +
    '<button class="btn gold" id="diceGo" style="margin-top:12px;display:none">继续</button></div>';
  document.body.appendChild(ov);
  var num = document.getElementById('dnum');
  var n = 0;
  var timer = setInterval(function(){
    num.textContent = 1 + Math.floor(Math.random() * 100);
    n++;
    if(n > 13){
      clearInterval(timer);
      num.textContent = roll;
      num.className = 'dn ' + (ok ? 'ok' : 'fail');
      var dv = document.getElementById('dver');
      dv.textContent = ok ? '成功' : '失败';
      dv.className = 'dv ' + (ok ? 'ok' : 'fail');
      document.getElementById('dtext').textContent = ok
        ? (o.deep ? '你摸到了不该摸的东西。' : '你看见了自己想看见的。')
        : '雾里有什么东西，替你把结论改掉了。';
      var go = document.getElementById('diceGo');
      go.style.display = 'inline-block';
      go.onclick = function(){
        ov.remove();
        resolveOpt(sid, idx, {roll:roll, ok:ok, eff:eff});
      };
    }
  }, 55);
}

function continueResult(){
  var after = S.result ? S.result.after : 'onward';
  S.result = null;
  if(after === 'siteevent') maybeEvent();
  else goOn();
}

function maybeEvent(){
  if(!S) return;
  if(S.time <= 0 || S.eventsSeen.length >= 5 || Math.random() > 0.42){ goOn(); return; }
  var pool = EVENTS.filter(function(e){ return S.eventsSeen.indexOf(e.id) < 0; });
  if(!pool.length){ goOn(); return; }
  var ev = pick(pool);
  S.eventsSeen.push(ev.id);
  S.curEvent = ev.id;
  S.node = 'event';
  S.result = null;
  saveRun();
  render();
}

function goOn(){
  if(!S) return;
  if(S.time <= 0){
    S.tooLate = true;
    addLog('时段耗尽，雾合拢了。');
    S.node = 'final';
    saveRun();
    render();
    return;
  }
  if(S.done.length >= 2 && !S.nights.n1){ S.nights.n1 = true; S.curNight = 'n1'; S.node = 'night'; saveRun(); render(); return; }
  if(S.done.length >= 4 && !S.nights.n2){ S.nights.n2 = true; S.curNight = 'n2'; S.node = 'night'; saveRun(); render(); return; }
  if(S.done.length >= 6 && !S.nights.n3){ S.nights.n3 = true; S.curNight = 'n3'; S.node = 'night'; saveRun(); render(); return; }
  S.node = 'hub';
  saveRun();
  render();
}

function chooseEvent(idx){
  var ev = null;
  EVENTS.forEach(function(e){ if(e.id === S.curEvent) ev = e; });
  if(!ev) return;
  var o = ev.opts[idx];
  if(!o) return;
  var lost = loseSan(o.san || 0);
  var gained = [];
  (o.clues || []).forEach(function(cid){ if(giveClue(cid)) gained.push(cid); });
  addLog('遭遇：' + ev.title);
  S.result = {
    kicker: ev.kicker, title: ev.title, body: o.ok,
    gained: gained, coreId: null, roll: null, eff: 0, ok: true,
    sanLost: lost, after: 'onward'
  };
  S.node = 'result';
  saveRun();
  render();
}

function chooseNight(idx){
  var n = null;
  NIGHTS.forEach(function(x){ if(x.id === S.curNight) n = x; });
  if(!n) return;
  var o = n.opts[idx];
  if(!o) return;
  var lost = loseSan(o.san || 0);
  var gained = [], coreId = null;
  (o.clues || []).forEach(function(cid){ if(giveClue(cid)) gained.push(cid); });
  if(o.core){
    var un = Object.keys(CLUES).filter(function(id){
      return id.indexOf('c_') === 0 && S.clues.indexOf(id) < 0;
    });
    if(un.length){
      coreId = pick(un);
      if(giveClue(coreId)) gained.push(coreId);
      else coreId = null;
    }
  }
  addLog('夜访：' + n.title);
  S.result = {
    kicker: n.kicker, title: n.title, body: o.ok,
    gained: gained, coreId: coreId, roll: null, eff: 0, ok: true,
    sanLost: lost, after: 'onward'
  };
  S.node = 'result';
  saveRun();
  render();
}

function doRest(){
  if(!S || S.time <= 0) return;
  S.time--;
  var before = S.san;
  var heal = 8 + Math.floor(Math.random() * 7);
  healSan(heal);
  var actual = S.san - before;
  S.restCount++;
  var extras = '';
  var gained = [];
  if(before < 30 && Math.random() < 0.5){
    loseSan(4);
    extras += '\n\n你闭上眼，立刻听见井底有人替你数呼吸。数到三十一，你惊醒，手心全是水。';
  }
  if(META.unlocked.length >= 6 && S.items.indexOf('zero') < 0){
    S.items.push('zero');
    extras += '\n\n枕边多了一页纸。没有字，边缘却很整齐，像从某本卷宗里撕下来的第零页。你把它收进内袋。';
    addLog('获得物品：第零页。');
  }
  addLog('休息。恢复 ' + Math.max(0, actual) + ' 点理智。');
  S.result = {
    kicker: '旅馆 · 第 ' + (13 - S.time) + ' 时段', title: '睡一会儿',
    body: '你合上眼。雾在窗外走来走去，像在替你守夜。\n\n理智恢复 ' + Math.max(0, actual) + ' 点。' + extras,
    gained: gained, coreId: null, roll: null, eff: 0, ok: true,
    sanLost: 0, after: 'onward'
  };
  S.node = 'result';
  saveRun();
  render();
}

function doDivine(){
  if(!S || S.time <= 0) return;
  if(S.san <= 50 && visibleSigils().length){ openPrayModal(); return; }
  divinePlain();
}
function divinePlain(){
  if(!S || S.time <= 0) return;
  S.time--;
  var lost = loseSan(4);
  var pool = Object.keys(CLUES).filter(function(id){
    return id.indexOf('c_') < 0 && S.clues.indexOf(id) < 0;
  });
  var gained = [], line = '';
  if(pool.length){
    var c = pick(pool);
    if(giveClue(c)){ gained.push(c); line = '盐水在碗底聚成一小片，映出一处你还没去过的地方。'; }
    else line = '水面很平。它什么也不肯再给你了。';
  }else{
    healSan(5);
    line = '水面很平。它没再给你线索，却把你心里那块石头挪开了一点。理智 +5。';
  }
  var stat = pick(['inv','will','luck']);
  var statName = STAT_LABEL[stat];
  S.buff[stat] = (S.buff[stat] || 0) + 20;
  var remain = 4 - coreCount();
  var coreline = remain > 0 ? ('雾里还有 ' + remain + ' 卷残页，没有被你翻开。') : '四卷残页都已在你手里。雾在退。';
  addLog('占卜：下一次' + statName + '判定 +20。');
  S.result = {
    kicker: '占卜 · 海盐与井水', title: '问雾',
    body: line + '\n\n碗里的水立起来一小截，像一根手指，指向你：下一次' + statName + '判定 +20。\n\n' + coreline,
    gained: gained, coreId: null, roll: null, eff: 0, ok: true,
    sanLost: lost, after: 'onward'
  };
  S.node = 'result';
  saveRun();
  render();
}

function openPrayModal(){
  if(!S || S.time <= 0) return;
  var p = prayPower();
  var html = '<div class="sec"><h4>向印记祈福 · 强度 ' + p + '</h4>';
  html += '<div class="galnote" style="text-align:left">理智越低，印记越清楚，回应却越弱。祈福消耗 1 时段；理智高于 50 时，印记不再回应。</div><div class="siggrid">';
  visibleSigils().forEach(function(s){
    html += '<div class="sigcard on" data-a="pray" data-id="' + s.id + '"><b>' + s.glyph + ' · ' + s.name + '</b><span>' + s.deity + '<br>' + esc(s.desc) + '</span></div>';
  });
  html += '</div><div class="galnote"><span class="sgchip" data-a="divineplain" style="cursor:pointer">不祈福 · 普通占卜</span></div></div>';
  openModal('占卜 · 盐与潮', html);
}
function praySigil(id){
  var s = sigilById(id);
  if(!s || !S || S.time <= 0) return;
  var ov = document.getElementById('modalOv'); if(ov) ov.remove();
  S.time--;
  var p = prayPower();
  var noCost = (s.fx === 'luckfree');
  var lost = noCost ? 0 : loseSan(4);
  var gained = [], coreId = null, extra = '', bufftxt = [];
  if(s.fx === 'inv'){
    S.buff.inv += 10 + 5 * p;
    healSan(p);
    bufftxt.push('侦查 +' + (10 + 5 * p));
    extra = '海水顺着你的指节流进纸页，替你翻到该看的那一页。理智 +' + p + '。';
  }else if(s.fx === 'clue'){
    var n = p >= 3 ? 2 : 1;
    randomNormalClues(n).forEach(function(c){ if(giveClue(c)) gained.push(c); });
    extra = gained.length ? ('被水泡开的字重新排好，露出 ' + gained.length + ' 条线索。') : '纸上什么也没有，连水痕都是旧的。';
  }else if(s.fx === 'core'){
    var cpool = ['c_name','c_contract','c_zero','c_writer'].filter(function(c){ return S.clues.indexOf(c) < 0; });
    if(p >= 3 && cpool.length){
      coreId = pick(cpool);
      if(giveClue(coreId)) gained.push(coreId);
      extra = '门开了一线，你抽出一卷残页。';
    }else{
      randomNormalClues(1).forEach(function(c){ if(giveClue(c)) gained.push(c); });
      S.buff.inv += 10;
      bufftxt.push('侦查 +10');
      extra = p >= 3 ? '门后是空的，只有一条线索被推了出来。' : '门只开了一条缝。你看见一页，却拿不到。';
    }
  }else if(s.fx === 'heal'){
    var h = (s.id === 'forest' ? 3 : 2) * p;
    healSan(h);
    extra = '你身上的裂口里长出细小的根。理智 +' + h + '。';
  }else if(s.fx === 'all'){
    S.buff.inv += p * 5; S.buff.will += p * 5; S.buff.luck += p * 5;
    var back = loseSan(2 * p);
    bufftxt.push('全判定 +' + (p * 5));
    extra = '它借给你很多张嘴，也借走了 ' + back + ' 点理智。';
  }else if(s.fx === 'will'){
    S.buff.will += 10 + 5 * p;
    bufftxt.push('意志 +' + (10 + 5 * p));
    extra = '你听见自己的心跳慢下来，像潮水退去。' + (p >= 4 ? '理智 +6。' : '');
    if(p >= 4) healSan(6);
  }else if(s.fx === 'luckfree'){
    S.buff.luck += p * 8;
    bufftxt.push('幸运 +' + (p * 8));
    extra = '它替你挡掉了一次本该发生的坏事。这次祈福没有索取理智。';
  }else if(s.fx === 'allcost'){
    S.buff.inv += p * 5; S.buff.will += p * 5; S.buff.luck += p * 5;
    var back2 = loseSan(3);
    bufftxt.push('全判定 +' + (p * 5));
    extra = '笛声没有停。你的手先于你写完了一行字。理智 -' + back2 + '。';
  }
  addLog('向' + s.name + '祈福（强度 ' + p + '）。' + (bufftxt.length ? bufftxt.join('、') + '。' : ''));
  var body = s.line + '\n\n' + extra
    + (bufftxt.length ? ('\n\n下一次判定：' + bufftxt.join(' · ') + '。') : '')
    + (lost ? ('\n\n这次祈福耗去 ' + lost + ' 点理智。') : '');
  S.result = {
    kicker: '占卜 · 向' + s.name + '祈福', title: s.deity,
    body: body, gained: gained, coreId: coreId, roll: null, eff: 0, ok: true,
    sanLost: lost, after: 'onward'
  };
  S.node = 'result';
  saveRun();
  render();
}

function enterDed(){
  if(!S || S.time <= 0) return;
  if(S.ded && S.ded.score >= 0){ toast('推理只能做一次。'); return; }
  S.time--;
  var bank = shuffle(DED_BANK).slice(0, 3);
  S.ded = {
    qs: bank.map(function(item){
      var correct = item.opts[item.a];
      return { q:item.q, opts:shuffle(item.opts.slice()), correct:correct, exp:item.exp, sel:-1 };
    }),
    score: -1, done: false
  };
  addLog('开始推理：三题定卷。');
  S.node = 'ded';
  S.result = null;
  saveRun();
  render();
}

function submitDed(){
  if(!S || !S.ded || !S.ded.qs.length) return;
  if(S.ded.qs.some(function(q){ return q.sel < 0; })){ toast('还有题目没有作答。'); return; }
  var ok = 0;
  S.ded.qs.forEach(function(q){
    if(q.sel >= 0 && q.opts[q.sel] === q.correct) ok++;
  });
  S.ded.score = ok;
  S.ded.done = true;
  var insight = [];
  var pool = Object.keys(CLUES).filter(function(id){ return id.indexOf('c_') < 0 && S.clues.indexOf(id) < 0; });
  for(var i = 0; i < ok && pool.length; i++){
    var c = pick(pool);
    if(giveClue(c)) insight.push(c);
    pool = pool.filter(function(x){ return x !== c; });
  }
  var healed = ok === 3 ? 5 : 0;
  if(healed) healSan(healed);
  var coreId = null;
  if(ok === 3){
    var cpool = Object.keys(CLUES).filter(function(id){ return id.indexOf('c_') === 0 && S.clues.indexOf(id) < 0; });
    if(cpool.length){
      coreId = pick(cpool);
      if(!giveClue(coreId)) coreId = null;
    }
  }
  S.ded.reward = { clues: insight, heal: healed, core: coreId };
  addLog('推理完成：' + ok + '/3' + (insight.length ? '，洞察线索 +' + insight.length : '') + (healed ? '，理智 +' + healed : '') + (coreId ? '，残卷 +1' : '') + '。');
  saveRun();
  render();
}

function openFinal(){
  if(!S) return;
  S.node = 'final';
  S.result = null;
  saveRun();
  render();
}

function chooseFinal(i){
  if(!S) return;
  var lock = choiceLock(i);
  if(lock){ toast(lock); return; }
  var c = CHOICES[i];
  var preSan = S.san;
  if(S.san <= 0){
    S.time = Math.max(0, S.time - 1);
    S.zeroJitter = (S.zeroJitter || 0) + 1;
    if(S.time <= 0) S.tooLate = true;
    addLog('理智已空：结案的代价改由一个时段支付。');
    S.lastSanNote = '时段 −1 · 理智已空（当前 0）';
    S.lastSanKind = 'time';
    sanFx(0, 'time', '时段被吞');
  }else{
    var cost = Math.min(c.cost, S.san);
    S.san = clamp(S.san - c.cost, 0, S.maxSan);
    S.sanLost += c.cost;
    S.lastSanNote = '结案代价 · 理智 −' + c.cost + (S.san <= 0 ? ' · 空壳' : '') + '（当前 ' + S.san + '）';
    S.lastSanKind = 'loss';
    if(cost > 0) sanFx(-cost, 'loss', S.san <= 0 ? '空壳' : '');
  }
  var sanB = S.san >= 60 ? 0 : (S.san >= 45 ? 1 : (S.san >= 30 ? 2 : (S.san >= 15 ? 3 : 4)));
  var core = coreCount();
  var truth = Math.min(3, core + (S.ded.score >= 2 ? 1 : 0));
  var grand = (i === 4 && core === 4 && preSan >= 60 && S.ded.score >= 3 && S.items.indexOf('zero') >= 0 && META.unlocked.length >= 6);
  var arch = null;
  var extra = grand ? null : extraEndingFor(i, preSan);
  if(grand){
    META.grand = true;
    saveMeta();
    S.ending = {
      grand:true, id:101, title:'第 101 号 · 第零页',
      body: caseRecap() + '\n\n' + GRAND_TEXT, verdict: GRAND_VERDICT,
      choice:i, sanB:sanB, truth:truth, core:core, isNew:true
    };
  }else if(extra){
    var xNew = META.unlocked.indexOf(extra.id) < 0;
    if(xNew){
      META.unlocked.push(extra.id);
      META.unlocked.sort(function(a, b){ return a - b; });
    }
    if(META.extra.indexOf(extra.id) < 0){
      META.extra.push(extra.id);
      META.extra.sort(function(a, b){ return a - b; });
    }
    saveMeta();
    S.ending = {
      grand:false, extra:true, id:extra.id, title:extra.title,
      body: caseRecap() + '\n\n' + extra.body, verdict:extra.verdict,
      choice:i, sanB:sanB, truth:truth, core:core, isNew:xNew
    };
  }else{
    var id = i * 20 + sanB * 4 + truth + 1;
    if(isBoundSlot(id)) id -= 1;
    var growNew = false;
    if(GROWTH_IDS.indexOf(id) >= 0 && META.growth.indexOf(id) < 0){
      META.growth.push(id);
      META.bonus = Math.min(60, (META.bonus || 0) + 10);
      saveMeta();
      growNew = true;
    }
    var isNew = META.unlocked.indexOf(id) < 0;
    if(isNew){
      META.unlocked.push(id);
      META.unlocked.sort(function(a, b){ return a - b; });
      saveMeta();
    }
    S.ending = {
      grand:false, id:id,
      title: c.title + ' · ' + TRUTH_NAMES[truth] + '（' + SAN_NAMES[sanB] + '）',
      body: [caseRecap(), OPEN_PARAS[i][Math.min(sanB, 3)], TRUTH_PARAS[i][truth], END_TAILS[id - 1]].join('\n\n'),
      verdict: VERDICTS[(id - 1) % VERDICTS.length],
      choice:i, sanB:sanB, truth:truth, core:core, isNew:isNew,
      growth:growNew, bonus:META.bonus
    };
  }
  S.node = 'ending';
  S.over = true;
  clearRun();
  render();
}

/* ---------- 弹窗 ---------- */
function openModal(title, html){
  var old = document.getElementById('modalOv');
  if(old) old.remove();
  var ov = document.createElement('div');
  ov.className = 'overlay';
  ov.id = 'modalOv';
  ov.innerHTML = '<div class="modal"><div class="mhead"><h3>' + esc(title) + '</h3><button class="x" data-a="closemodal">×</button></div><div class="mbody">' + html + '</div></div>';
  document.body.appendChild(ov);
}

function endingMeta(id){
  var sx = null;
  for(var si = 0; si < EXTRA_ENDINGS.length; si++){
    if(EXTRA_ENDINGS[si].id === id){ sx = EXTRA_ENDINGS[si]; break; }
  }
  if(sx && META.extra.indexOf(id) >= 0) return { c:0, sanB:0, truth:0, title:sx.title };
  var n = id - 1;
  var c = Math.floor(n / 20);
  var rem = n % 20;
  var sanB = Math.floor(rem / 4);
  var truth = rem % 4;
  return {
    c:c, sanB:sanB, truth:truth,
    title: CHOICES[c].title + ' · ' + TRUTH_NAMES[truth] + '（' + SAN_NAMES[sanB] + '）'
  };
}

function openSubmit(){
  if(!S || !S.sigils || !S.sigils.length) return;
  var html = '<div class="sec"><h4>选择要臣服的印记</h4><div class="siggrid">';
  ownedSigils().forEach(function(s){
    html += '<div class="sigcard on" data-a="submitsig" data-id="' + s.id + '"><b>' + s.glyph + ' · ' + s.name + '</b><span>' + esc(s.deity) + '</span></div>';
  });
  html += '</div><div class="galnote" style="text-align:left">臣服不可撤回。三枚柱神印记都被臣服后，其它印记将不再显现，理智归零。</div></div>';
  openModal('异变臣服', html);
}
function submitSigil(id){
  var s = sigilById(id);
  if(!s || !S) return;
  var ov = document.getElementById('modalOv'); if(ov) ov.remove();
  if(META.submit.indexOf(id) < 0) META.submit.push(id);
  if(META.bound.indexOf(id) < 0) META.bound.push(id);
  var allOuter = OUTER_IDS.every(function(x){ return META.submit.indexOf(x) >= 0; });
  var triple = allOuter && !META.outerDone;
  if(allOuter) META.outerDone = true;
  if(triple){
    var preS = S.san;
    S.san = 0;
    S.lastSanNote = '三柱神 · 理智归零（当前 0）';
    S.lastSanKind = 'loss';
    if(preS > 0) sanFx(-preS, 'loss', '三柱神 · 空壳');
    else sanFx(0, 'time', '三柱神 · 空壳');
  }
  var slot = BOUND_BY_SIGIL[id];
  var ci = Math.floor((slot - 1) / 20);
  var rest = (slot - 1) % 20;
  var sb = Math.floor(rest / 4);
  var tr = rest % 4;
  var base = [caseRecap(), OPEN_PARAS[ci][Math.min(sb, 3)], TRUTH_PARAS[ci][tr], END_TAILS[slot - 1]].join('\n\n');
  var isNew = META.unlocked.indexOf(slot) < 0;
  if(isNew){
    META.unlocked.push(slot);
    META.unlocked.sort(function(a, b){ return a - b; });
  }
  if(META.boundAt) META.boundAt[slot] = triple ? 'triple' : id;
  S.ending = {
    bound:true, id:slot, sigil:id,
    title: triple ? '三柱神 · 空壳' : s.endTitle,
    verdict: triple ? TRIPLE_VERDICT : s.verdict,
    body: base + '\n\n' + (triple ? TRIPLE_TEXT : s.endBody),
    choice:ci, sanB:sb, truth:tr, core:coreCount(), isNew:isNew
  };
  saveMeta();
  S.over = true;
  S.node = 'ending';
  clearRun();
  render();
}

function synopsisFor(id){
  if(id === 101) return '第零页翻开了：记录者终于看见自己，也看见是谁在写他。';
  var bv = META.boundAt ? META.boundAt[id] : null;
  if(bv){
    if(bv === 'triple') return '门、笑、林在你身上连成一线。你签完第三个名字，雾港从地图上退走。';
    var sg = sigilById(bv);
    if(sg) return sg.deity + '。' + sg.verdict;
  }
  var m = endingMeta(id);
  var tail = END_TAILS[id - 1] || '';
  var first = tail.split(/[。！？]/)[0];
  var line = first ? (first + '。') : '雾把这一页收走了，只留下你的名字。';
  return m.title.replace(/^[^·]+·\s*/, '') + '：' + line;
}

function galleryPulse(id){

  document.body.classList.remove('dizzy');

  document.body.classList.add('dizzy');

}

function useItem(idx){
  if(!S) return;
  var id = S.items[idx];
  if(!id) return;
  var it = ITEMS[id];
  if(!it) return;
  if(it.use === 'buffInv'){
    S.buff.inv += 20; S.items.splice(idx, 1); toast('下一次侦查判定 +20');
  }else if(it.use === 'buffWill'){
    S.buff.will += 15; S.items.splice(idx, 1); toast('下一次意志判定 +15');
  }else if(it.use === 'heal'){
    healSan(15); S.items.splice(idx, 1); toast('理智恢复 15');
  }else if(it.use === 'shield'){
    S.shield += 8; S.items.splice(idx, 1); toast('护身符亮了，可抵挡 8 点理智损失');
  }else if(it.use === 'clue'){
    var arr = randomNormalClues(1);
    if(arr.length){
      giveClue(arr[0]);
      S.items.splice(idx, 1);
      toast('磁带里录着：' + CLUES[arr[0]].name);
    }else{
      toast('磁带转了很久，什么也没录下。');
    }
  }else if(it.use === 'readZero'){
    toast('纸上没有字。它不是给人读的。');
    return;
  }
  saveRun();
  var ov = document.getElementById('modalOv');
  if(ov) ov.remove();
  updateHud();
  openNotes();
}

/* ---------- 音效 ---------- */
function toggleAudio(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ toast('此浏览器不支持环境音。'); return; }
    if(!audioCtx){
      audioCtx = new AC();
      audioGain = audioCtx.createGain();
      audioGain.gain.value = 0;
      var lp = audioCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 300;
      var o1 = audioCtx.createOscillator();
      o1.type = 'sine'; o1.frequency.value = 54;
      var o2 = audioCtx.createOscillator();
      o2.type = 'sine'; o2.frequency.value = 81.5;
      var o3 = audioCtx.createOscillator();
      o3.type = 'triangle'; o3.frequency.value = 109;
      o1.connect(lp); o2.connect(lp); o3.connect(lp);
      lp.connect(audioGain);
      audioGain.connect(audioCtx.destination);
      o1.start(); o2.start(); o3.start();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    audioOn = !audioOn;
    audioGain.gain.setTargetAtTime(audioOn ? 0.03 : 0, audioCtx.currentTime, 0.6);
    var btn = document.getElementById('audioBtn');
    if(btn) btn.classList.toggle('on', audioOn);
  }catch(e){ toast('环境音没能打开。'); }
}

/* ---------- 交互分发 ---------- */
function handleAction(a, id, q, o, el){
  switch(a){
    case 'start':
    case 'again':
      DRAFT = { arch:'field', name:'', inv:55, will:55, luck:55 };
      S = { node:'create' };
      clearRun();
      render();
      break;
    case 'resume':
      var r = loadRun();
      if(r){ S = r; render(); toast('接上了上一次的雾。'); }
      else toast('没有找到存档。');
      break;
    case 'toTitle':
      S = null;
      render();
      break;
    case 'gallery':
      openGallery();
      break;
    case 'notes':
      openNotes();
      break;
    case 'audio':
      toggleAudio();
      break;
    case 'closemodal':
      var ov = document.getElementById('modalOv');
      if(ov) ov.remove();
      break;
    case 'arch':
      readDraft();
      DRAFT.arch = id;
      render();
      break;
    case 'dice':
      readDraft();
      var others = ['inv','will','luck'].filter(function(k){ return k !== id; });
      var room = pointCap() - (DRAFT[others[0]] || 0) - (DRAFT[others[1]] || 0);
      var hi = Math.min(90, room);
      if(hi < 30){ toast('剩余点数不足（可分配上限 ' + Math.max(hi, 0) + '），请先降低其他两项。'); break; }
      DRAFT[id] = 30 + Math.floor(Math.random() * (hi - 29));
      render();
      break;
    case 'rollall':
      readDraft();
      var capAll = pointCap();
      var total = Math.min(capAll, 150 + Math.floor(Math.random() * Math.max(1, capAll - 149)));
      var left = total - 90;
      var add = [0, 0, 0];
      while(left > 0){
        var i = Math.floor(Math.random() * 3);
        if(add[i] < 60){ add[i]++; left--; }
      }
      DRAFT.inv = 30 + add[0];
      DRAFT.will = 30 + add[1];
      DRAFT.luck = 30 + add[2];
      render();
      break;
    case 'confirm':
      readDraft();
      var bad = ['inv','will','luck'].filter(function(k){ return DRAFT[k] < 30 || DRAFT[k] > 90; });
      if(bad.length){ toast('三项属性需在 30–90 之间。'); render(); break; }
      var sum = DRAFT.inv + DRAFT.will + DRAFT.luck;
      if(sum > pointCap()){ toast('三项基础值合计不能超过 ' + pointCap() + '（当前 ' + sum + '，超出 ' + (sum - pointCap()) + '）。'); render(); break; }
      initRun();
      break;
    case 'enter':
      if(S && S.done.indexOf(id) < 0){
        S.curSite = id;
        S.node = 'site';
        render();
      }
      break;
    case 'leave':
      if(S){ S.node = 'hub'; render(); }
      break;
    case 'opt':
      if(S) chooseOpt(id, parseInt(q, 10));
      break;
    case 'cont':
      if(S) continueResult();
      break;
    case 'rest':
      doRest();
      break;
    case 'divine':
      doDivine();
      break;
    case 'divineplain':
      divinePlain();
      break;
    case 'pray':
      praySigil(id);
      break;
    case 'dm':
      onDanmaku(el);
      break;
    case 'submitopen':
      openSubmit();
      break;
    case 'submitsig':
      submitSigil(id);
      break;
    case 'sigilinfo':
      showSigilInfo(id);
      break;
    case 'gcell': {
      var gid = parseInt(id, 10);
      galleryPulse(gid);
      setTimeout(function(){ showGalleryCell(gid); }, 520);
      break;
    }
    case 'gdm':
      showGalleryCell(parseInt(id, 10));
      break;
    case 'ded':
      enterDed();
      break;
    case 'dedpick':
      if(S && S.ded && S.ded.qs[parseInt(q, 10)]){
        S.ded.qs[parseInt(q, 10)].sel = parseInt(o, 10);
        var keepY = window.scrollY;
        render();
        window.scrollTo(0, keepY);
      }
      break;
    case 'dedsubmit':
      submitDed();
      break;
    case 'dedback':
      goOn();
      break;
    case 'eventpick':
      if(S) chooseEvent(parseInt(q, 10));
      break;
    case 'nightpick':
      if(S) chooseNight(parseInt(q, 10));
      break;
    case 'finalopen':
      openFinal();
      break;
    case 'final':
      chooseFinal(parseInt(id, 10));
      break;
    case 'useItem':
      useItem(parseInt(q, 10));
      break;
  }
}

document.addEventListener('input', function(e){
  var id = e.target && e.target.id;
  if(id && id.charAt(0) === 'c' && id !== 'cName') updateSums();
});

document.addEventListener('click', function(e){
  if(e.target && e.target.id === 'modalOv'){ e.target.remove(); return; }
  var el = e.target && e.target.closest ? e.target.closest('[data-a]') : null;
  if(!el) return;
  handleAction(el.getAttribute('data-a'), el.getAttribute('data-id'), el.getAttribute('data-q'), el.getAttribute('data-o'), el);
});

render();
setInterval(function(){
  if(S && S.node !== 'ending' && S.san <= 25 && Math.random() < 0.4) showWhisper();
}, 21000);
</script>
